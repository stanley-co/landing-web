name: Build and Deploy React Web to VPS

on:
  push:
    branches:
      - develop
      - feature/*

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Клонируем репозиторий на runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Устанавливаем зависимости на runner
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      # 3️⃣ Настраиваем SSH
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # 4️⃣ Подготавливаем и загружаем код на VPS
      - name: Prepare and upload code
        env:
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
        run: |
          # Создаем архив с кодом (исключаем node_modules и .git)
          tar -czf deploy.tar.gz --exclude='node_modules' --exclude='.git' .
          
          # Загружаем архив на VPS
          scp -i ~/.ssh/id_deploy deploy.tar.gz $SSH_USER@$SSH_HOST:~/stanley-co/web/
          
          # Распаковываем и настраиваем на VPS
          ssh -i ~/.ssh/id_deploy $SSH_USER@$SSH_HOST << 'EOF'
            set -e
            cd ~/stanley-co/web
            
            # Останавливаем текущий контейнер
            docker stop stanok-landing || true
            docker rm stanok-landing || true
            
            # Удаляем старый код (сохраняем только node_modules если есть)
            if [ -d landing-web ]; then
              rm -rf landing-web
            fi
            
            # Распаковываем новый код
            mkdir -p landing-web
            tar -xzf deploy.tar.gz -C landing-web --strip-components=0
            rm deploy.tar.gz
            
            cd landing-web
            
            # Устанавливаем зависимости и собираем проект
            npm ci --only=production
            npm run build
            
            # Собираем и запускаем Docker контейнер
            docker build -t stanok-landing:latest .
            docker run -d --name stanok-landing -p 4066:80 --restart unless-stopped stanok-landing:latest
            
            # Очищаем старые образы
            docker image prune -f
            
            echo "✅ Deploy completed successfully!"
EOF