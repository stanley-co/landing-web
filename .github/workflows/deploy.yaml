name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - 'release/**'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:

# ==========================================================
# DEV DEPLOY
# ==========================================================
  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build (DEV)
        env:
          VITE_S3_HOST: ${{ secrets.VITE_S3_HOST }}
          VITE_S3_BUCKET: ${{ secrets.VITE_S3_BUCKET }}
          VITE_TELEGRAM_BOT_TOKEN: ${{ secrets.VITE_TELEGRAM_BOT_TOKEN }}
          VITE_TELEGRAM_CHAT_ID: ${{ secrets.VITE_TELEGRAM_CHAT_ID }}
          VITE_BITRIX_WEBHOOK_URL: ${{ secrets.VITE_BITRIX_WEBHOOK_URL }}
          VITE_FORM_SUBMISSION_TARGET: ${{ secrets.VITE_FORM_SUBMISSION_TARGET }}
          VITE_BITRIX_DEMO_MODE: ${{ secrets.VITE_BITRIX_DEMO_MODE }}
          VITE_FORM_DISABLED: ${{ secrets.VITE_FORM_DISABLED }}
        run: |
          npm ci
          npm run build

      - name: Setup SSH (DEV)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to DEV Server
        run: |
          rsync -avz --delete \
            dist/ Dockerfile nginx.conf \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/homic/stanley-co/web/github-actions/

          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            set -e
            cd /home/homic/stanley-co/web/github-actions &&
            docker build -t stanok-landing-dev:latest . &&
            docker stop stanok-landing-dev || true &&
            docker rm stanok-landing-dev || true &&
            docker run -d \
              --name stanok-landing-dev \
              -p ${{ secrets.APP_PORT }}:80 \
              --network ${{ secrets.DOCKER_NETWORK }} \
              --restart unless-stopped \
              stanok-landing-dev:latest
          "

# ==========================================================
# PRODUCTION DEPLOY
# ==========================================================
  deploy-prod:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        run: |
          VERSION="${GITHUB_REF#refs/heads/release/}"
          if [ -z "$VERSION" ]; then
            echo "Invalid release branch"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build (PROD)
        env:
          VITE_S3_HOST: ${{ secrets.VITE_S3_HOST }}
          VITE_S3_BUCKET: ${{ secrets.VITE_S3_BUCKET }}
          VITE_TELEGRAM_BOT_TOKEN: ${{ secrets.VITE_TELEGRAM_BOT_TOKEN }}
          VITE_TELEGRAM_CHAT_ID: ${{ secrets.VITE_TELEGRAM_CHAT_ID }}
          VITE_BITRIX_WEBHOOK_URL: ${{ secrets.VITE_BITRIX_WEBHOOK_URL }}
          VITE_FORM_SUBMISSION_TARGET: ${{ secrets.VITE_FORM_SUBMISSION_TARGET }}
          VITE_BITRIX_DEMO_MODE: ${{ secrets.VITE_BITRIX_DEMO_MODE }}
          VITE_FORM_DISABLED: ${{ secrets.VITE_FORM_DISABLED }}
        run: |
          npm ci
          npm run build

      - name: Setup SSH (PROD)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to PROD Server
        run: |
          rsync -avz --delete \
            dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/root/fkit/web/landing/releases/${VERSION}/

          rsync -avz \
            Dockerfile nginx.conf \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/root/fkit/web/landing/

          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            set -e
            cd /root/fkit/web/landing

            ln -sfn releases/${VERSION} current

            rm -rf dist
            cp -r releases/${VERSION}/ dist

            docker build -t stanok-landing:${VERSION} -t stanok-landing:latest . &&
            docker stop stanok-landing-prod || true &&
            docker rm stanok-landing-prod || true &&
            docker run -d \
              --name stanok-landing-prod \
              -p ${{ secrets.APP_PORT }}:80 \
              --network ${{ secrets.DOCKER_NETWORK }} \
              --restart unless-stopped \
              stanok-landing:${VERSION}
          "
