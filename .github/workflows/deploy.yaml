name: Build and Deploy React Web to VPS

on:
  push:
    branches:
      - develop
      - feature/*

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Устанавливаем зависимости на runner (sshpass, git, docker)
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git docker.io docker-compose nodejs npm

      # 2️⃣ Копируем SSH ключ на runner
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      # 3️⃣ Клонируем репозиторий прямо на VPS и билдим ветку develop
      - name: Build & Deploy on VPS
        env:
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_deploy $SSH_USER@$SSH_HOST <<EOF
            set -e
            cd ~/stanley-co/web || mkdir -p ~/stanley-co/web && cd ~/stanley-co/web

            # Клонируем или обновляем репозиторий
            if [ ! -d landing-web ]; then
              git clone -b develop git@github.com:stanley-co/landing-web.git
            else
              cd landing-web
              git fetch origin develop
              git reset --hard origin/develop
              cd ..
            fi

            cd landing-web

            # Устанавливаем Node.js зависимости
            npm ci

            # Собираем фронтенд
            npm run build

            # Сборка Docker образа
            docker build -t stanok-landing:latest .

            # Останавливаем старый контейнер (если есть)
            docker stop stanok-landing || true
            docker rm stanok-landing || true

            # Запускаем новый контейнер
            docker run -d --name stanok-landing -p 4066:80 stanok-landing:latest
EOF
