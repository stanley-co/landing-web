name: Build and Deploy React Web to VPS

on:
  push:
    branches:
      - main
      - feature/*

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Клонируем код
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Устанавливаем Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3️⃣ Ставим зависимости
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Сборка фронтенда
      - name: Build project
        run: npm run build

      # 5️⃣ Загружаем артефакт сборки (dist)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # 1️⃣ Скачиваем собранный артефакт
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: ./dist

      # 2️⃣ Копируем Dockerfile
      - name: Checkout code
        uses: actions/checkout@v4

      # 3️⃣ Деплой на VPS
      - name: Deploy to VPS via SSH
        env:
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass

          # Создаем каталог на сервере
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "mkdir -p /home/$SSH_USER/stanley-co/web/github-actions"

          # Передаем dist и Dockerfile
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no -r ./dist $SSH_USER@$SSH_HOST:/home/$SSH_USER/stanley-co/web/github-actions/dist
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no Dockerfile $SSH_USER@$SSH_HOST:/home/$SSH_USER/stanley-co/web/github-actions/Dockerfile

          # Выполняем сборку и перезапуск контейнера
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST << 'EOF'
            set -e
            cd /home/homic/stanley-co/web/github-actions

            docker stop stanok-landing || true
            docker rm stanok-landing || true
            docker rmi stanok-landing:latest || true

            docker build -t stanok-landing:latest .
            docker run -d --name stanok-landing -p 4066:80 stanok-landing:latest
          EOF
