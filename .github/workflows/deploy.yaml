name: Build and Deploy React Web to VPS

on:
  push:
    branches:
      - main
      - develop
      - feature/*

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Устанавливаем sshpass на runner (для SSH по паролю)
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      # 2️⃣ Выполняем деплой на VPS
      - name: Build and Deploy on VPS
        env:
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "
            set -e

            # Папка проекта
            APP_DIR=/home/$SSH_USER/stanley-co/web/landing-web

            # Если папка не существует, клонируем репозиторий
            if [ ! -d \$APP_DIR ]; then
              git clone https://github.com/${{ github.repository }} \$APP_DIR
            fi

            cd \$APP_DIR
            git fetch --all
            git reset --hard origin/${GITHUB_REF##*/}

            # Устанавливаем Node.js через nvm (если нет)
            if ! command -v node >/dev/null 2>&1; then
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.6/install.sh | bash
              export NVM_DIR=\"$HOME/.nvm\"
              [ -s \"$NVM_DIR/nvm.sh\" ] && \. \"$NVM_DIR/nvm.sh\"
              nvm install 20
            else
              node -v
            fi

            # Устанавливаем зависимости и билдим
            npm ci
            npm run build

            # Собираем Docker образ
            docker build -t stanok-landing:latest .

            # Останавливаем старый контейнер, если есть
            docker stop stanok-landing || true
            docker rm stanok-landing || true

            # Запускаем новый контейнер
            docker run -d --name stanok-landing -p 4066:80 stanok-landing:latest
          "
