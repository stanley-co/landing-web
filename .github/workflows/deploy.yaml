name: Build and Deploy React Web to VPS

on:
  push:
    branches:
      - main
      - develop
      - feature/*

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Клонируем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Устанавливаем Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3️⃣ Устанавливаем зависимости
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Собираем фронтенд
      - name: Build project
        run: npm run build

      # 5️⃣ Сохраняем Docker образ для ARM64
      - name: Build Docker image for ARM64
        run: |
          docker build --platform linux/arm64 -t stanok-landing:latest .

      # 6️⃣ Сохраняем образ в tar для передачи
      - name: Save Docker image
        run: docker save stanok-landing:latest -o stanok-landing.tar

      # 7️⃣ Загружаем образ как артефакт
      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: stanok-landing.tar

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # 1️⃣ Скачиваем Docker образ
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: ./docker-image

      # 2️⃣ Деплой на VPS
      - name: Deploy Docker image to VPS
        env:
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass

          # Копируем tar с образом на VPS
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no ./docker-image/stanok-landing.tar $SSH_USER@$SSH_HOST:/home/$SSH_USER/stanley-co/web/github-actions/

          # Загружаем образ и перезапускаем контейнер
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "
            set -e
            cd /home/$SSH_USER/stanley-co/web/github-actions
            docker load -i stanok-landing.tar
            docker stop stanok-landing || true
            docker rm stanok-landing || true
            docker run -d --name stanok-landing -p 4066:80 stanok-landing:latest
          "
