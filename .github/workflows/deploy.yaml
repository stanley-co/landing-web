name: Build and Deploy React Web to VPS

on:
  push:
    branches:
      - develop
      - feature/*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build
          # Копируем build в dist, чтобы совпадало с VPS
          rm -rf github-actions/dist
          mkdir -p github-actions/dist
          cp -r build/* github-actions/dist/

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-deploy
          path: github-actions/dist
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: react-deploy
          path: ./deploy

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to VPS
        env:
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST '
            set -e
            cd ~/stanley-co/web/github-actions
            docker stop stanok-landing || true
            docker rm stanok-landing || true
            docker rmi stanok-landing:latest || true
            docker build -t stanok-landing:latest .
            docker run -d --name stanok-landing -p 4066:80 --restart unless-stopped stanok-landing:latest
          '