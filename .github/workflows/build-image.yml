name: Build image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.repository }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Resolve image name
        shell: bash
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/landing-web" >> "$GITHUB_OUTPUT"
      - id: sha
        name: Resolve immutable tags
        shell: bash
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "short=${COMMIT_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ steps.image.outputs.value }}
          tags: |
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}
            type=raw,value=sha-${{ steps.sha.outputs.short }}
            type=raw,value=develop
            type=raw,value=test
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          build-args: |
            VITE_PUBLIC_API_BASE_URL=/api/v1
            VITE_S3_HOST=/
            VITE_S3_BUCKET=media
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record published digest
        run: echo "Published ${{ steps.image.outputs.value }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
