name: CI

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "release/**"
      - "hotfix/**"
      - "bugfix/**"
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check source hygiene
        run: git diff --check
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_PUBLIC_API_BASE_URL: ${{ vars.VITE_PUBLIC_API_BASE_URL || '/api/v1' }}
          VITE_S3_HOST: ${{ vars.VITE_S3_HOST || '/' }}
          VITE_S3_BUCKET: ${{ vars.VITE_S3_BUCKET || 'media' }}
          VITE_ADMIN_PREVIEW_ORIGIN: ${{ vars.VITE_ADMIN_PREVIEW_ORIGIN || 'http://localhost:5173' }}
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify production image build without publishing
        run: docker build --build-arg VITE_PUBLIC_API_BASE_URL="$VITE_PUBLIC_API_BASE_URL" --build-arg VITE_S3_HOST="$VITE_S3_HOST" --build-arg VITE_S3_BUCKET="$VITE_S3_BUCKET" --build-arg VITE_ADMIN_PREVIEW_ORIGIN="$VITE_ADMIN_PREVIEW_ORIGIN" -t landing-web:ci .
        env:
          VITE_PUBLIC_API_BASE_URL: ${{ vars.VITE_PUBLIC_API_BASE_URL || '/api/v1' }}
          VITE_S3_HOST: ${{ vars.VITE_S3_HOST || '/' }}
          VITE_S3_BUCKET: ${{ vars.VITE_S3_BUCKET || 'media' }}
          VITE_ADMIN_PREVIEW_ORIGIN: ${{ vars.VITE_ADMIN_PREVIEW_ORIGIN || 'http://localhost:5173' }}
