openapi: 3.0.3
info:
  title: FKIT Web Platform API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /public/site:
    get:
      summary: Get public site settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProductCardDto' }
  /public/menu/{code}:
    get:
      summary: Get menu by code
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
  /public/pages/{route}:
    get:
      summary: Get public page by route
      parameters:
        - { name: route, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetailDto' }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/products:
    get:
      summary: Get public products
      parameters:
        - { name: categoryId, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: OK }
  /public/products/{id}:
    get:
      summary: Get product by existing public ID
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/product-categories:
    get:
      summary: Get category tree
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductCategoryDto' }
  /public/content:
    get:
      summary: Get news/articles list
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/ContentType' } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ContentListItemDto' }
  /public/news/{id}:
    get:
      summary: Get news or article by existing ID
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentDetailDto' }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/slides:
    get:
      summary: Get slides
      parameters:
        - { name: pageCode, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SlideDto' }
  /public/contacts:
    get:
      summary: Get public contacts
      responses:
        '200': { description: OK }
  /public/documents:
    get:
      summary: Get public documents
      responses:
        '200': { description: OK }
  /public/certificates:
    get:
      summary: Get public certificates
      responses:
        '200': { description: OK }
  /public/leads:
    post:
      summary: Create lead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadCreateRequest' }
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/login:
    post:
      summary: Login
      responses:
        '200': { description: OK }
  /auth/refresh:
    post:
      summary: Refresh token
      responses:
        '200': { description: OK }
  /auth/logout:
    post:
      summary: Logout
      responses:
        '204': { description: No Content }
  /auth/me:
    get:
      summary: Current admin user
      responses:
        '200': { description: OK }
components:
  schemas:
    Status:
      type: string
      enum: [DRAFT, ACTIVE, ARCHIVED]
    ContentType:
      type: string
      enum: [NEWS, ARTICLE]
    ErrorResponse:
      type: object
      required: [timestamp, status, code, message, requestId]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        code: { type: string }
        message: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
        requestId: { type: string }
    LeadCreateRequest:
      type: object
      required: [consentAccepted]
      properties:
        source: { type: string }
        formType: { type: string }
        company: { type: string }
        firstName: { type: string }
        secondName: { type: string }
        lastName: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        comment: { type: string }
        productId: { type: string }
        productName: { type: string }
        consentAccepted: { type: boolean }
    ProductCardDto:
      type: object
      required: [id, name, category, image, description]
      properties:
        id: { type: string, description: Existing public product ID }
        name: { type: string }
        globalCategory: { type: string }
        category: { type: string }
        image: { type: string }
        description: { type: string }
    ProductDetailDto:
      allOf:
        - { $ref: '#/components/schemas/ProductCardDto' }
        - type: object
          properties:
            galleryImages:
              type: array
              items: { type: string }
            fullDescription: { type: string }
            specs:
              type: array
              items: { $ref: '#/components/schemas/ProductSpecDto' }
            advantages:
              type: array
              items: { $ref: '#/components/schemas/ProductAdvantageDto' }
            videoUrl: { type: string }
            relatedArticles:
              type: array
              items: { $ref: '#/components/schemas/ContentListItemDto' }
    ProductSpecDto:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string }
        sortOrder: { type: integer }
    ProductAdvantageDto:
      type: object
      required: [icon, title, description]
      properties:
        icon: { type: string }
        title: { type: string }
        description: { type: string }
        sortOrder: { type: integer }
    ProductCategoryDto:
      type: object
      required: [id, name, sortOrder, activeProductCount]
      properties:
        id: { type: string }
        name: { type: string }
        anchor: { type: string }
        sortOrder: { type: integer }
        activeProductCount: { type: integer }
        children:
          type: array
          items: { $ref: '#/components/schemas/ProductCategoryDto' }
    SlideDto:
      type: object
      required: [id, image, title, description]
      properties:
        id: { type: string }
        image: { type: string }
        title: { type: string }
        description: { type: string }
        link: { type: string }
        buttonText: { type: string }
    ContentListItemDto:
      type: object
      required: [id, type, title, date, image, preview]
      properties:
        id: { type: string, description: Existing public content ID }
        type: { $ref: '#/components/schemas/ContentType' }
        title: { type: string }
        date: { type: string, format: date }
        category: { type: string }
        image: { type: string }
        preview: { type: string }
    ContentDetailDto:
      allOf:
        - { $ref: '#/components/schemas/ContentListItemDto' }
        - type: object
          properties:
            blocks:
              type: array
              items: { $ref: '#/components/schemas/ContentBlockDto' }
            related:
              type: array
              items: { $ref: '#/components/schemas/ContentListItemDto' }
    ContentBlockDto:
      type: object
      required: [type, sortOrder]
      properties:
        type:
          type: string
          enum: [paragraph, image, quote, link]
        sortOrder: { type: integer }
        text: { type: string }
        src: { type: string }
        caption: { type: string }
        url: { type: string }
        linkText: { type: string }
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
